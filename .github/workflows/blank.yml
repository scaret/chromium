name: Import to Private (server-side)

on:
  workflow_dispatch:
    inputs:
      source_url:
        description: "Source git URL"
        required: true
        default: "https://github.com/scaret/chromium.git"
      target_owner:
        description: "Target owner"
        required: true
        default: "scaret"
      target_repo:
        description: "Target repo name"
        required: true
        default: "chromium-private"

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Check secret
        run: 'test -n "${{ secrets.TARGET_TOKEN }}" || (echo "Missing TARGET_TOKEN secret"; exit 1)'

      - name: Ensure target repo exists (create private if missing)
        env:
          TOKEN: ${{ secrets.TARGET_TOKEN }}
        run: |
          set -euo pipefail
          OWNER="${{ github.event.inputs.target_owner }}"
          REPO="${{ github.event.inputs.target_repo }}"
          AUTH="Authorization: token ${TOKEN}"
          ACCEPT="Accept: application/vnd.github+json"

          code=$(curl -s -o /dev/null -w "%{http_code}" -H "$AUTH" -H "$ACCEPT" \
            "https://api.github.com/repos/${OWNER}/${REPO}")
          if [ "$code" = "404" ]; then
            body='{"name":"'"$REPO"'","private":true}'
            # 若要建到组织：改用 https://api.github.com/orgs/<org>/repos
            code=$(curl -s -o /dev/null -w "%{http_code}" -X POST -H "$AUTH" -H "$ACCEPT" \
              https://api.github.com/user/repos -d "$body")
            [ "$code" = "201" ] || { echo "Create repo failed: HTTP $code"; exit 1; }
            echo "Created ${OWNER}/${REPO} (private)"
          else
            echo "Target exists (HTTP $code)"
          fi

      - name: Start server-side import
        env:
          TOKEN: ${{ secrets.TARGET_TOKEN }}
        run: |
          set -euo pipefail
          OWNER="${{ github.event.inputs.target_owner }}"
          REPO="${{ github.event.inputs.target_repo }}"
          SRC="${{ github.event.inputs.source_url }}"
          AUTH="Authorization: token ${TOKEN}"
          ACCEPT="Accept: application/vnd.github+json"
          body='{"vcs":"git","vcs_url":"'"$SRC"'"}'

          code=$(curl -s -o /dev/null -w "%{http_code}" -X PUT -H "$AUTH" -H "$ACCEPT" \
            "https://api.github.com/repos/${OWNER}/${REPO}/import" -d "$body")
          [ "$code" = "201" ] || [ "$code" = "202" ] || { echo "Import start failed: HTTP $code"; exit 1; }
          echo "Import started. Check: https://github.com/${OWNER}/${REPO}/import"
